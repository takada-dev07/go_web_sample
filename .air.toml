# Air 設定ファイル
# AirはGoアプリケーションのホットリロードツールです

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # ビルド前後に実行するコマンド
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -mod=mod -o ./tmp/main ./cmd/server/main.go"
  delay = 1000 # ファイル変更検知後の待機時間（ミリ秒）
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "cmd/server/t"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true

