version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    container_name: go_web_sample_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - DB_TYPE=sqlite
      - DB_PATH=/data/app.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_SECRET=dev-secret-key-change-in-production
      - JWT_EXPIRATION_HOURS=24
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes:
      - ./data:/data
      - .:/app
      - /app/tmp
      - /app/vendor
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: go_web_sample_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
